services:
  vangran-funding:
    container_name: vangran-funding
    build: .
    expose:
      - 8000
    ports:
      - 100.109.30.53:8000:8000
    networks:
      - cloudflared-net-tn_demo
    volumes:
      - db_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    environment:
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN:-}

volumes:
  db_data:

networks:
  cloudflared-net-tn_demo:
    external: true
