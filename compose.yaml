services:
  vangran-funding:
    container_name: vangran-funding
    build: .
    expose:
      - 8000
    ports:
      - 100.109.30.53:8000:8000
    networks:
      - cloudflared-net-tn_demo
    volumes:
      - db_data:/app/data
    restart: unless-stopped

volumes:
  db_data:

networks:
  cloudflared-net-tn_demo:
    external: true
