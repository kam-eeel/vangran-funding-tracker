<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart — Vangran Funding Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#d71920',
            accent: { blue: '#4078f2', cyan: '#0184bc', green: '#50a14f', yellow: '#c18401', red: '#d71920', purple: '#a626a4', orange: '#986801' },
          },
          borderRadius: { DEFAULT: '4px' },
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col">
  <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-12">
        <div class="flex items-center gap-2.5">
          <div class="w-7 h-7 rounded bg-primary flex items-center justify-center">
            <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <span class="font-semibold text-sm tracking-wide uppercase hidden sm:block">Vangran</span>
        </div>
        <div class="flex items-center gap-1">
          <a href="/" data-nav="/" class="px-3 py-1 rounded text-sm font-medium transition-colors text-gray-500 hover:text-gray-900 hover:bg-gray-100">Dashboard</a>
          <a href="/explore.html" data-nav="/explore" class="px-3 py-1 rounded text-sm font-medium transition-colors text-gray-500 hover:text-gray-900 hover:bg-gray-100">Explore</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="space-y-4">
      <div class="flex items-center gap-3">
        <a href="/" class="text-gray-400 hover:text-gray-700 transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <div>
          <h1 id="chart-title" class="text-lg font-semibold"></h1>
          <p class="text-xs text-gray-500 mt-0.5">All data — filter to narrow results</p>
        </div>
      </div>

      <div class="flex flex-col lg:flex-row gap-4">
        <aside id="filter-sidebar" class="hidden lg:block w-full lg:w-60 shrink-0">
          <div class="bg-white rounded border border-gray-200 p-3 space-y-3">
            <h3 class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Filters</h3>
            <div>
              <label class="block text-[10px] font-medium text-gray-500 mb-1">Department</label>
              <select id="cf-department" class="w-full px-2 py-1.5 text-xs border border-gray-200 rounded focus:outline-none focus:border-primary"><option value="">All</option></select>
            </div>
            <div>
              <label class="block text-[10px] font-medium text-gray-500 mb-1">Program</label>
              <select id="cf-program" class="w-full px-2 py-1.5 text-xs border border-gray-200 rounded focus:outline-none focus:border-primary"><option value="">All</option></select>
            </div>
            <div>
              <label class="block text-[10px] font-medium text-gray-500 mb-1">Postal Code</label>
              <select id="cf-postal" class="w-full px-2 py-1.5 text-xs border border-gray-200 rounded focus:outline-none focus:border-primary"><option value="">All</option></select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-medium text-gray-500 mb-1">Start From</label>
                <input type="date" id="cf-date-from" class="w-full px-2 py-1.5 text-xs border border-gray-200 rounded focus:outline-none focus:border-primary">
              </div>
              <div>
                <label class="block text-[10px] font-medium text-gray-500 mb-1">Start To</label>
                <input type="date" id="cf-date-to" class="w-full px-2 py-1.5 text-xs border border-gray-200 rounded focus:outline-none focus:border-primary">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-medium text-gray-500 mb-1">Min Amount</label>
                <input type="number" id="cf-amount-min" placeholder="0" class="w-full px-2 py-1.5 text-xs border border-gray-200 rounded focus:outline-none focus:border-primary">
              </div>
              <div>
                <label class="block text-[10px] font-medium text-gray-500 mb-1">Max Amount</label>
                <input type="number" id="cf-amount-max" placeholder="Any" class="w-full px-2 py-1.5 text-xs border border-gray-200 rounded focus:outline-none focus:border-primary">
              </div>
            </div>
            <div class="flex gap-2 pt-1">
              <button id="btn-apply" class="flex-1 px-3 py-1.5 bg-primary text-white text-xs font-medium rounded hover:bg-red-700 transition-colors">Apply</button>
              <button id="btn-clear" class="flex-1 px-3 py-1.5 bg-white border border-gray-200 text-xs font-medium rounded hover:bg-gray-50 transition-colors">Clear</button>
            </div>
          </div>
        </aside>

        <div class="flex-1 min-w-0 space-y-4">
          <div class="bg-white rounded border border-gray-200 p-4" id="chart-container" style="min-height: 520px;">
            <canvas id="chart-main"></canvas>
          </div>
          <div id="data-table-container"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-t border-gray-100 mt-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-gray-400">
      <span>Data source: <a href="https://open.canada.ca/data/en/dataset/432527ab-7aac-45b5-81d6-7597107a7013" target="_blank" rel="noopener" class="underline hover:text-gray-600">Government of Canada — Proactive Disclosure of Grants and Contributions</a></span>
      <span id="last-updated"></span>
    </div>
  </footer>

  <script src="/js/shared.js"></script>
  <script>
  (function () {
    const urlParams = new URLSearchParams(window.location.search);
    const chartType = urlParams.get('type') || 'department';
    const titles = { department: 'Funding by Department', program: 'Funding by Program', postal: 'Funding by Postal Code', timeline: 'Funding Timeline' };
    document.getElementById('chart-title').textContent = titles[chartType] || 'Chart';

    function getFilters() {
      const p = new URLSearchParams();
      const dept = document.getElementById('cf-department').value;
      const prog = document.getElementById('cf-program').value;
      const postal = document.getElementById('cf-postal').value;
      const dateFrom = document.getElementById('cf-date-from').value;
      const dateTo = document.getElementById('cf-date-to').value;
      const amtMin = document.getElementById('cf-amount-min').value;
      const amtMax = document.getElementById('cf-amount-max').value;
      if (dept) p.set('department', dept);
      if (prog) p.set('program', prog);
      if (postal) p.set('postal_code', postal);
      if (dateFrom) p.set('start_date_from', dateFrom);
      if (dateTo) p.set('start_date_to', dateTo);
      if (amtMin) p.set('amount_min', amtMin);
      if (amtMax) p.set('amount_max', amtMax);
      return p;
    }

    let currentChart = null;

    async function loadFilters() {
      const data = await fetch('/api/filters').then(r => r.json());
      const deptSel = document.getElementById('cf-department');
      const progSel = document.getElementById('cf-program');
      const postalSel = document.getElementById('cf-postal');
      data.departments.forEach(d => { const o = document.createElement('option'); o.value = d; o.textContent = shortDepartment(d); deptSel.appendChild(o); });
      data.programs.forEach(d => { const o = document.createElement('option'); o.value = d; o.textContent = d; progSel.appendChild(o); });
      data.postal_codes.forEach(d => { const o = document.createElement('option'); o.value = d; o.textContent = d; postalSel.appendChild(o); });
    }

    async function loadChart() {
      const params = getFilters();
      const canvas = document.getElementById('chart-main');
      let data, chartCfg;

      Chart.defaults.color = THEME.text;
      Chart.defaults.borderColor = THEME.grid;
      Chart.defaults.font.family = 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace';
      Chart.defaults.font.size = 11;

      if (currentChart) { currentChart.destroy(); currentChart = null; }

      if (chartType === 'department') {
        params.set('limit', '0');
        data = await fetch('/api/charts/department?' + params).then(r => r.json());
        chartCfg = {
          type: 'bar',
          data: { labels: data.labels, datasets: [{ data: data.data, backgroundColor: data.labels.map((_, i) => PALETTE[i % PALETTE.length]), borderRadius: 2, borderSkipped: false }] },
          options: {
            indexAxis: 'y', responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { ...tooltipConfig(), callbacks: { title: (items) => data.full_names[items[0].dataIndex], label: (item) => `  ${formatCurrency(item.raw)}  ·  ${data.counts[item.dataIndex].toLocaleString()} contributions` } } },
            scales: { x: { grid: { color: THEME.grid }, ticks: { callback: v => formatCurrency(v), color: THEME.muted, font: { size: 10 } } }, y: { grid: { display: false }, ticks: { color: THEME.text, font: { size: 10 } } } }
          }
        };
        document.getElementById('chart-container').style.minHeight = Math.max(400, data.labels.length * 28 + 60) + 'px';
      } else if (chartType === 'program') {
        params.set('limit', '0');
        data = await fetch('/api/charts/program?' + params).then(r => r.json());
        chartCfg = {
          type: 'doughnut',
          data: { labels: data.labels, datasets: [{ data: data.data, backgroundColor: data.labels.map((_, i) => PALETTE[i % PALETTE.length]), borderWidth: 1, borderColor: '#fff', hoverOffset: 4 }] },
          options: {
            responsive: true, maintainAspectRatio: false, cutout: '50%',
            plugins: { legend: { position: 'right', labels: { color: THEME.text, padding: 6, usePointStyle: true, pointStyleWidth: 8, font: { size: 10 } } }, tooltip: { ...tooltipConfig(), callbacks: { label: (item) => `  ${formatCurrency(item.raw)}  ·  ${data.counts[item.dataIndex].toLocaleString()} contributions` } } }
          }
        };
      } else if (chartType === 'timeline') {
        data = await fetch('/api/charts/timeline?' + params).then(r => r.json());
        chartCfg = {
          type: 'line',
          data: { labels: data.labels, datasets: [
            { label: 'Funding', data: data.amounts, borderColor: '#d71920', backgroundColor: 'rgba(215,25,32,0.08)', fill: true, tension: 0.3, pointRadius: 4, pointHoverRadius: 6, borderWidth: 2, yAxisID: 'y' },
            { label: 'Contributions', data: data.counts, borderColor: '#61afef', backgroundColor: 'transparent', fill: false, tension: 0.3, pointRadius: 4, pointHoverRadius: 6, borderWidth: 2, borderDash: [4, 2], yAxisID: 'y1' }
          ] },
          options: {
            responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
            plugins: { legend: { labels: { color: THEME.text, usePointStyle: true, font: { size: 10 } } }, tooltip: { ...tooltipConfig(), callbacks: { label: (item) => item.datasetIndex === 0 ? `  Funding: ${formatCurrency(item.raw)}` : `  Contributions: ${item.raw.toLocaleString()}` } } },
            scales: {
              x: { grid: { color: THEME.grid }, ticks: { color: THEME.muted, font: { size: 10 } } },
              y: { type: 'linear', position: 'left', grid: { color: THEME.grid }, ticks: { callback: v => formatCurrency(v), color: THEME.muted, font: { size: 10 } }, title: { display: true, text: 'Amount', color: THEME.muted, font: { size: 10 } } },
              y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false }, ticks: { color: THEME.muted, font: { size: 10 } }, title: { display: true, text: 'Count', color: THEME.muted, font: { size: 10 } } }
            }
          }
        };
      } else if (chartType === 'postal') {
        data = await fetch('/api/charts/postal?' + params).then(r => r.json());
        chartCfg = {
          type: 'bar',
          data: { labels: data.labels, datasets: [{ data: data.data, backgroundColor: data.labels.map((_, i) => PALETTE[i % PALETTE.length]), borderRadius: 2, borderSkipped: false }] },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { ...tooltipConfig(), callbacks: { label: (item) => `  ${formatCurrency(item.raw)}  ·  ${data.counts[item.dataIndex].toLocaleString()} contributions` } } },
            scales: { y: { grid: { color: THEME.grid }, ticks: { callback: v => formatCurrency(v), color: THEME.muted, font: { size: 10 } } }, x: { grid: { display: false }, ticks: { color: THEME.text, font: { size: 11, weight: 'bold' } } } }
          }
        };
      }

      currentChart = new Chart(canvas, chartCfg);

      if ((chartType === 'department' || chartType === 'program') && data) {
        renderTable(data, chartType);
      }
    }

    function renderTable(data, type) {
      const container = document.getElementById('data-table-container');
      const nameKey = type === 'department' ? 'full_names' : 'labels';
      const nameLabel = type === 'department' ? 'Department' : 'Program';
      let rows = data[nameKey].map((name, i) => ({ name, total: data.data[i], count: data.counts[i] }));
      let sortCol = 'total', sortDir = 'desc';

      function sorted() {
        return [...rows].sort((a, b) => {
          const av = a[sortCol], bv = b[sortCol];
          if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
          return sortDir === 'asc' ? av - bv : bv - av;
        });
      }
      function icon(col) {
        if (sortCol !== col) return '';
        return sortDir === 'asc'
          ? '<svg class="w-3 h-3 inline-block ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>'
          : '<svg class="w-3 h-3 inline-block ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>';
      }
      function render() {
        const total = rows.reduce((s, r) => s + r.total, 0);
        const thCls = (col, align = 'left') => `px-3 py-2 text-${align} text-[10px] font-semibold uppercase tracking-wider cursor-pointer select-none whitespace-nowrap text-gray-500 hover:text-primary ${sortCol === col ? 'text-primary' : ''}`;
        const tbody = sorted().map(r => {
          const pct = total > 0 ? (r.total / total * 100).toFixed(1) : '0.0';
          return `<tr class="hover:bg-gray-50 border-b border-gray-100"><td class="px-3 py-2 text-xs text-gray-800 break-words max-w-xs">${r.name || '\u2014'}</td><td class="px-3 py-2 text-xs text-right font-mono font-medium text-accent-green whitespace-nowrap">${formatCurrency(r.total)}</td><td class="px-3 py-2 text-xs text-right font-mono text-gray-500 whitespace-nowrap">${r.count.toLocaleString()}</td><td class="px-3 py-2 text-xs text-right font-mono text-gray-400 whitespace-nowrap">${pct}%</td></tr>`;
        }).join('');
        container.innerHTML = `<div class="bg-white rounded border border-gray-200 overflow-hidden"><table class="w-full text-xs"><thead class="bg-gray-50 border-b border-gray-200"><tr><th class="${thCls('name')}" data-col="name">${nameLabel} ${icon('name')}</th><th class="${thCls('total','right')}" data-col="total">Total Funding ${icon('total')}</th><th class="${thCls('count','right')}" data-col="count">Contributions ${icon('count')}</th><th class="${thCls('total','right')}">% of Total</th></tr></thead><tbody>${tbody}</tbody></table></div>`;
        container.querySelectorAll('th[data-col]').forEach(th => {
          th.addEventListener('click', () => {
            const col = th.dataset.col;
            if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
            else { sortCol = col; sortDir = col === 'name' ? 'asc' : 'desc'; }
            render();
          });
        });
      }
      render();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await loadFilters();
      await loadChart();

      document.getElementById('btn-apply').addEventListener('click', loadChart);
      document.getElementById('btn-clear').addEventListener('click', () => {
        document.getElementById('cf-department').value = '';
        document.getElementById('cf-program').value = '';
        document.getElementById('cf-postal').value = '';
        document.getElementById('cf-date-from').value = '';
        document.getElementById('cf-date-to').value = '';
        document.getElementById('cf-amount-min').value = '';
        document.getElementById('cf-amount-max').value = '';
        loadChart();
      });
    });
  })();
  </script>
</body>
</html>
