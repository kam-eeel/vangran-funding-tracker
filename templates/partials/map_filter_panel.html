<form id="map-filter-form" method="get" action="/map"
      class="bg-white rounded border border-gray-200 p-3 space-y-3">

    <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Filters</h3>

    <div>
        <label class="block text-[10px] font-medium text-gray-500 mb-1 uppercase tracking-wider">Search</label>
        <input type="text" name="search" value="{{ filters.get('search', '') }}"
               placeholder="Recipient, program, ref..."
               class="w-full px-2.5 py-1.5 text-xs rounded border border-gray-300 bg-white text-gray-900 focus:ring-1 focus:ring-primary focus:border-primary outline-none placeholder:text-gray-400">
    </div>

    <div>
        <label class="block text-[10px] font-medium text-gray-500 mb-1 uppercase tracking-wider">Department</label>
        <select name="department"
                class="w-full px-2.5 py-1.5 text-xs rounded border border-gray-300 bg-white text-gray-900 focus:ring-1 focus:ring-primary focus:border-primary outline-none">
            <option value="">All Departments</option>
            {% for dept in filter_options.departments %}
            <option value="{{ dept }}" {% if filters.get('department') == dept %}selected{% endif %}>
                {{ dept.split('|')[0].strip() if '|' in dept else dept.rsplit(' - ', 1)[0].strip() if ' - ' in dept else dept }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label class="block text-[10px] font-medium text-gray-500 mb-1 uppercase tracking-wider">Program</label>
        <input type="text" name="program" value="{{ filters.get('program', '') }}"
               list="map-program-list"
               placeholder="Type to search..."
               class="w-full px-2.5 py-1.5 text-xs rounded border border-gray-300 bg-white text-gray-900 focus:ring-1 focus:ring-primary focus:border-primary outline-none placeholder:text-gray-400">
        <datalist id="map-program-list">
            {% for prog in filter_options.programs %}
            <option value="{{ prog }}">
            {% endfor %}
        </datalist>
    </div>

    <div>
        <label class="block text-[10px] font-medium text-gray-500 mb-1 uppercase tracking-wider">Postal Code (FSA)</label>
        <select name="postal_code"
                class="w-full px-2.5 py-1.5 text-xs rounded border border-gray-300 bg-white text-gray-900 focus:ring-1 focus:ring-primary focus:border-primary outline-none">
            <option value="">All Areas</option>
            {% for pc in filter_options.postal_codes %}
            <option value="{{ pc }}" {% if filters.get('postal_code') == pc %}selected{% endif %}>{{ pc }}</option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label class="block text-[10px] font-medium text-gray-500 mb-1 uppercase tracking-wider">Start Date Range</label>
        <div class="flex flex-col gap-1.5">
            <input type="date" name="start_date_from" value="{{ filters.get('start_date_from', '') }}"
                   class="w-full px-2 py-1.5 text-xs rounded border border-gray-300 bg-white text-gray-900 focus:ring-1 focus:ring-primary focus:border-primary outline-none">
            <input type="date" name="start_date_to" value="{{ filters.get('start_date_to', '') }}"
                   class="w-full px-2 py-1.5 text-xs rounded border border-gray-300 bg-white text-gray-900 focus:ring-1 focus:ring-primary focus:border-primary outline-none">
        </div>
    </div>

    <div>
        <label class="block text-[10px] font-medium text-gray-500 mb-1 uppercase tracking-wider">Amount Range</label>
        <div class="flex flex-col gap-1.5">
            <input type="number" name="amount_min" value="{{ filters.get('amount_min', '') }}"
                   placeholder="Min"
                   class="w-full px-2 py-1.5 text-xs rounded border border-gray-300 bg-white text-gray-900 focus:ring-1 focus:ring-primary focus:border-primary outline-none placeholder:text-gray-400">
            <input type="number" name="amount_max" value="{{ filters.get('amount_max', '') }}"
                   placeholder="Max"
                   class="w-full px-2 py-1.5 text-xs rounded border border-gray-300 bg-white text-gray-900 focus:ring-1 focus:ring-primary focus:border-primary outline-none placeholder:text-gray-400">
        </div>
    </div>

    <div class="flex gap-2 pt-1">
        <button type="submit"
                class="flex-1 px-3 py-1.5 text-xs font-medium rounded bg-primary text-white hover:bg-primary/90 transition-colors">
            Apply
        </button>
        <a href="/map"
           class="flex-1 px-3 py-1.5 text-xs font-medium rounded border border-gray-300 text-center text-gray-600 hover:bg-gray-50 transition-colors">
            Clear
        </a>
    </div>
</form>
