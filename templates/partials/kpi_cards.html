<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
    <div class="bg-white rounded border border-gray-200 p-4 border-l-2 border-l-primary">
        <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Total Funding</p>
        <p class="text-xl font-bold mt-1 text-primary">{{ kpis.total_funding_fmt }}</p>
    </div>
    <div class="bg-white rounded border border-gray-200 p-4 border-l-2 border-l-accent-blue">
        <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Contributions</p>
        <p class="text-xl font-bold mt-1 text-accent-blue">{{ "{:,}".format(kpis.record_count) }}</p>
    </div>
    <div class="bg-white rounded border border-gray-200 p-4 border-l-2 border-l-accent-green">
        <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Avg Contribution</p>
        <p class="text-xl font-bold mt-1 text-accent-green">{{ kpis.avg_amount_fmt }}</p>
    </div>
    <div class="bg-white rounded border border-gray-200 p-4 border-l-2 border-l-accent-yellow">
        <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Programs</p>
        <p class="text-xl font-bold mt-1 text-accent-yellow">{{ "{:,}".format(kpis.program_count) }}</p>
    </div>
</div>
