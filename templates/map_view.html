{% extends "base.html" %}

{% block title %}{{ title }} — Vangran Funding Tracker{% endblock %}

{% block content %}
<div class="space-y-4">
    <div class="flex items-center gap-3">
        <a href="/" class="text-gray-400 hover:text-gray-700 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <div>
            <h1 class="text-lg font-semibold">{{ title }}</h1>
            <p class="text-xs text-gray-500 mt-0.5">All funding records plotted by postal code</p>
        </div>
    </div>

    <div class="bg-white rounded border border-gray-200 p-4">
        <div id="map-container" style="height: calc(100vh - 200px); min-height: 400px;"></div>
    </div>
</div>

<!-- Record detail modal -->
<div id="record-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/40" onclick="document.getElementById('record-modal').classList.add('hidden')"></div>
    <div id="record-modal-content" class="relative w-full max-w-2xl max-h-[85vh] overflow-y-auto bg-white rounded shadow-xl"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/map.js"></script>
<script>
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            document.getElementById('record-modal').classList.add('hidden');
        }
    });
</script>
{% endblock %}
