{% extends "base.html" %}

{% block title %}Map — Vangran Funding Tracker{% endblock %}

{% block content %}
<div class="space-y-4">
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a href="/" class="text-gray-400 hover:text-gray-700 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                </svg>
            </a>
            <div>
                <h1 class="text-lg font-semibold">Funding Map</h1>
                <p class="text-xs text-gray-500 mt-0.5">All geocoded contributions — Vancouver Granville</p>
            </div>
        </div>
        <button id="filter-toggle"
                onclick="document.getElementById('filter-sidebar').classList.toggle('hidden')"
                class="lg:hidden px-3 py-1.5 rounded bg-white border border-gray-200 text-xs font-medium flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
            </svg>
            Filters
        </button>
    </div>

    <div class="flex flex-col lg:flex-row gap-4" style="height: calc(100vh - 10rem);">
        <!-- Filter panel -->
        <aside id="filter-sidebar" class="hidden lg:block w-full lg:w-56 shrink-0">
            {% include "partials/map_filter_panel.html" %}
        </aside>

        <!-- Record list sidebar -->
        <div class="w-full lg:w-64 shrink-0 bg-white rounded border border-gray-200 overflow-y-auto">
            <div class="p-3 border-b border-gray-100 sticky top-0 bg-white z-10">
                <p class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider">
                    Contributions (<span id="map-point-count">—</span>)
                </p>
            </div>
            <div id="map-sidebar-list" class="divide-y divide-gray-100">
                <!-- Populated by map.js -->
            </div>
        </div>

        <!-- Map -->
        <div class="flex-1 min-w-0 bg-white rounded border border-gray-200 overflow-hidden">
            <div id="map" class="w-full h-full"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/map.js?v=2"></script>
{% endblock %}
